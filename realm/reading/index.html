<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1E1B4B">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Elearnea</title>
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="icon" href="../../assets/img/icon-32.png" type="image/png">
<link rel="apple-touch-icon" href="../../assets/img/icon-180.png">
<link rel="stylesheet" href="../../assets/css/el.css">
<link rel="stylesheet" href="../../assets/css/realm.css">
</head>
<body class="night" data-realm="reading">
<div class="app">
  <div class="topbar">
    <a class="btn round indigo" id="back" href="../../map/" aria-label="Back to the map" data-say="Back to the map"></a>
    <div class="ribbon"><h1 id="title"></h1></div>
    <button class="lantern" id="lantern" aria-label="Progress"></button>
  </div>
  <div class="scroller" id="scroller"><div class="path" id="path"><svg id="road" class="road"></svg></div></div>
</div>
<div class="foot">
  <div class="bubble say" id="say"></div>
  <button class="wick" id="wick" aria-label="Wick"><img src="../../assets/img/wick-sm.webp" alt=""></button>
  <button class="btn round big glow go" id="go"></button>
  <button class="btn round sm indigo snd" id="snd"></button>
</div>
<script src="../../voice/voice.js"></script>
<script src="../../assets/js/el.js"></script>
<script src="../../assets/js/realm.js"></script>
</body>
</html>
